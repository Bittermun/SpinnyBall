[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "spinnyball"
version = "0.2.0"
description = "Lunar Orbital Belt Logistics Engine - Gyroscopic Mass-Stream Digital Twin"
authors = ["Bittermun"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/bittermun/SpinnyBall"
keywords = ["cislunar", "mass-stream", "gyroscopic", "orbital-mechanics", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
packages = [
    { include = "dynamics" },
    { include = "src" },
    { include = "monte_carlo" },
    { include = "control_layer" },
    { include = "scripts" },
]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26.0"
scipy = "^1.11.0"
sympy = "^1.12"
matplotlib = "^3.8.0"
pint = "^0.23"

# MPC & Optimization (for Weeks 4-6)
casadi = { version = "^3.6.0", optional = true }
numba = { version = "^0.60.0", optional = true }

# ML Predictor (for Weeks 7-9)
torch = { version = "^2.5.0", optional = true }

# JAX for thermal models (Phase 2 ML Enhancement)
jax = { version = "^0.4.0", optional = true }
jaxlib = { version = "^0.4.0", optional = true }

# Sensitivity & Monte-Carlo (for Weeks 7-9)
SALib = { version = "^1.4.0", optional = true }

# Data & ML (for synthetic failure generation and anomaly detection)
h5py = { version = "^3.11.0", optional = true }
scikit-learn = { version = "^1.5.0", optional = true }

# Backend API (for Weeks 10-12)
fastapi = { version = "^0.115.0", optional = true }
uvicorn = { version = "^0.32.0", optional = true }
pydantic = { version = "^2.10.0", optional = true }

# Validation (existing)
mujoco = { version = "^3.1.0", optional = true }
control = "^0.10.2"

[tool.poetry.extras]
mpc = ["casadi", "numba"]
ml = ["torch"]
jax = ["jax", "jaxlib"]
monte-carlo = ["SALib", "torch"]
data = ["h5py", "scikit-learn"]
validation = ["mujoco"]
backend = ["fastapi", "uvicorn", "pydantic"]
all = ["casadi", "numba", "torch", "jax", "jaxlib", "SALib", "h5py", "scikit-learn", "mujoco", "fastapi", "uvicorn", "pydantic"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.4.0"
mypy = "^1.7.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
# Simulation scripts
lob-scaling = "scripts.lob_scaling:main"
sgms-anchor = "src.sgms_anchor_v1:main"
sgms-suite = "src.sgms_anchor_suite:main"

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",   # Line too long (handled by black)
    "N802",   # Function name should be lowercase (physics: matrix operations)
    "N803",   # Argument name should be lowercase (physics: matrices use uppercase)
    "N806",   # Variable in function should be lowercase (physics: I, L, S, R, etc.)
    "N815",   # Mixed-case variable in class scope (physics)
    "N816",   # Mixed-case variable in global scope (physics)
    "N817",   # CamelCase imported as acronym (physics)
    "N999",   # Invalid module name (legacy file naming)
    "E741",   # Ambiguous variable name (physics: I = inertia, l = length)
    "E402",   # Module level import not at top of file (optional imports pattern)
    "E743",   # Ambiguous function name (physics conventions)
    "B007",   # Loop control variable not used in loop body (simulation patterns)
    "B023",   # Function definition in loop (simulation patterns)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = [
    "assignment",
    "attr-defined",
    "arg-type",
    "call-arg",
    "call-overload",
    "dict-item",
    "has-type",
    "index",
    "misc",
    "no-redef",
    "operator",
    "return-value",
    "type-arg",
    "union-attr",
    "var-annotated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

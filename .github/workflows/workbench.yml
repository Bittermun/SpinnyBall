name: Scientific workbench

on:
  push:
    branches: [main, 'codex/**']
    paths: ['workbench/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analytic models, convergence, invariants and serialization
        run: node --test workbench/tests/physics.test.mjs workbench/tests/audit.test.mjs workbench/tests/plot-data.test.mjs workbench/tests/sweep.test.mjs
      - name: Local server contract
        run: python -m unittest discover -s workbench/tests -p "test_*.py"
      - name: JavaScript syntax
        run: |
          node --check workbench/app.mjs
          node --check workbench/worker.mjs
          node --check workbench/run.mjs
          node --check workbench/audit.mjs
          node --check workbench/plot-data.mjs
          node --check workbench/sweep.mjs
      - name: Python syntax
        run: |
          python -m py_compile workbench/__main__.py workbench/tests/test_launcher.py
